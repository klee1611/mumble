# DigitalOcean App Platform: the phone app (free static site) and the API
# (Functions), both built from GitHub on every push. Same origin, so /api needs
# no CORS. Create it from the dashboard (Apps → Create → upload this spec) or
# `doctl apps create --spec .do/app.yaml`. Set the two SECRET values there.
name: mumble
static_sites:
  - name: web
    github:
      repo: klee1611/mumble
      branch: main
      deploy_on_push: true
    source_dir: web
    index_document: index.html
    catchall_document: index.html
    routes:
      - path: /
functions:
  - name: api
    github:
      repo: klee1611/mumble
      branch: main
      deploy_on_push: true
    source_dir: functions
    routes:
      - path: /api
    envs:
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: MUMBLE_TOKEN
        scope: RUN_AND_BUILD_TIME
        type: SECRET
