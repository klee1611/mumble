# DigitalOcean Functions project. Deploy with scripts/deploy-functions.sh;
# ${VARS} come from functions/.env (see functions/.env.example).
environment:
  DATABASE_URL: "${DATABASE_URL}"
  MUMBLE_TOKEN: "${MUMBLE_TOKEN}"
  GH_REPO: "${GH_REPO}"
  GH_TOKEN: "${GH_TOKEN}"
packages:
  - name: mumble
    functions:
      # The whole API: one raw web function that routes on the path.
      - name: api
        runtime: python:3.11
        web: raw
        limits:
          timeout: 15000
          memory: 256
      # The alarm clock: wakes the GitHub Actions night shift.
      - name: wake
        runtime: python:3.11
        web: false
        triggers:
          - name: three-am-toronto
            sourceType: scheduler
            sourceDetails:
              cron: "0 7 * * *"   # 07:00 UTC = 3 AM EDT (2 AM after DST ends)
