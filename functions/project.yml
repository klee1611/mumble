# DigitalOcean Functions project. Deploy with scripts/deploy-functions.sh;
# ${VARS} come from functions/.env (see functions/.env.example).
environment:
  DATABASE_URL: "${DATABASE_URL}"
  MUMBLE_TOKEN: "${MUMBLE_TOKEN}"
packages:
  - name: mumble
    functions:
      # The whole API: one raw web function that routes on the path.
      - name: api
        runtime: python:3.11
        web: raw
        limits:
          timeout: 15000
          memory: 256
