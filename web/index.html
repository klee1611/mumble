<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f6b4a">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://dev-l1bc0yw26epgfj00.us.auth0.com; media-src 'self' blob:; img-src 'self' data:; object-src 'none'; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mumble">
  <title>Mumble</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <section id="login" hidden>
      <h1>Mumble</h1>
      <p class="muted">Say it now. Sort it never. Sign in once; your phone remembers.</p>
      <button id="sign-in" type="button">Sign in</button>
      <p id="login-note" class="muted small">Your memos are only ever shown to you. Each account gets
        20 memos a day, and you can delete everything in one tap.</p>
    </section>

    <section id="tab-mumble" class="tab">
      <header>
        <h1>Mumble</h1>
        <p class="muted">Say it now. Sort it never.</p>
      </header>

      <button id="rec" class="rec" aria-label="Start recording">
        <span class="rec-dot"></span>
        <span id="rec-label">Tap and mumble</span>
        <span id="rec-time" class="rec-time"></span>
      </button>

      <label class="upload">
        <input id="file" type="file" accept="audio/*,.m4a,.webm,.opus" multiple hidden>
        or hand over a recording you already made
      </label>

      <div id="pile" class="card pile"></div>
      <p id="toast" class="toast" role="status" aria-live="polite"></p>
    </section>

    <section id="tab-morning" class="tab" hidden>
      <header>
        <h1>Good morning</h1>
        <p id="payoff" class="muted"></p>
      </header>
      <div id="review"></div>
      <div id="digest"></div>
    </section>

    <section id="tab-remember" class="tab" hidden>
      <header>
        <h1>What did I say?</h1>
        <p class="muted">Search everything you ever mumbled.</p>
      </header>
      <form id="search-form" class="search">
        <input id="q" type="search" placeholder="the dentist, that blog idea…" minlength="2" required>
        <button type="submit">Find</button>
      </form>
      <div id="results"></div>
      <div id="me" class="card"></div>
    </section>
  </main>

  <nav id="tabs">
    <button data-tab="mumble" aria-current="page">🎙️<span>Mumble</span></button>
    <button data-tab="morning">☀️<span>Morning</span></button>
    <button data-tab="remember">🔎<span>Remember</span></button>
  </nav>

  <script src="/config.js"></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
