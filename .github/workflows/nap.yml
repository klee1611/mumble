# The night shift: 3 AM in Toronto, or by hand from the Actions tab.
# Free CPU runner, open models, nobody waiting.
name: nap

on:
  workflow_dispatch:
    inputs:
      review:
        description: "Also run the Ultramarine weekly review"
        type: boolean
        default: false
  schedule:
    - cron: "0 7 * * *"  # 07:00 UTC = 3 AM EDT (2 AM EST); GitHub may start it a little late

permissions:
  contents: read

concurrency:
  group: nap
  cancel-in-progress: false

jobs:
  nap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Secrets are set per step, so the third-party Ollama installer never sees them.
    env:
      MUMBLE_MODEL: gemma4:e2b-it-qat
      MUMBLE_EMBED_MODEL: embeddinggemma
      WHISPER_MODEL: small
      MUMBLE_TZ: America/Toronto
      OLLAMA_MODELS: /home/runner/.ollama/models
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Anything to do?
        id: pending
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          n=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM memos WHERE status='pending'" 2>/dev/null || echo 1)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "dow=$(date -u +%u)" >> "$GITHUB_OUTPUT"
          echo "pending memos: $n"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Cache models
        if: steps.pending.outputs.count != '0'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /home/runner/.ollama/models
            /home/runner/.cache/huggingface
          key: models-${{ env.MUMBLE_MODEL }}-${{ env.MUMBLE_EMBED_MODEL }}-whisper-${{ env.WHISPER_MODEL }}

      - name: Start Ollama
        if: steps.pending.outputs.count != '0'
        run: |
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION=0.40.2 sh
          sudo systemctl stop ollama || true
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:11434/api/version && break; sleep 1; done
          ollama pull "$MUMBLE_MODEL"
          ollama pull "$MUMBLE_EMBED_MODEL"

      - name: Nap
        if: steps.pending.outputs.count != '0'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv sync --no-dev --group nap
          uv run --no-dev --group nap python -m mumble.nap

      # Sunday 3 AM (07:00 UTC is still Sunday), or on request: Ultramarine
      # reads the whole week at once. Costs a fraction of a cent.
      - name: Weekly review
        if: (github.event_name == 'schedule' && steps.pending.outputs.dow == '7') || inputs.review
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAPERINSTRUMENTS_API_KEY: ${{ secrets.PAPERINSTRUMENTS_API_KEY }}
        run: |
          uv sync --no-dev --group nap
          uv run --no-dev --group nap python -m mumble.review
